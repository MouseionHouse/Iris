# Iris: one build of the web app per push, used for everything that ships.
#
#   plan ── bundle ──┬── deploy                  (dev: the web client on server, iris.example.org)
#                    └── apk ── publish-fdroid   (dev: the Android app, fdroid.example.org)
#   plan ── desktop                              (check only: the Nix package of the Linux desktop shell)
#
# `bundle` runs the one `npm ci` and `vite build` of a push, inside the Docker image that serves
# the web client, and exports what the Android project needs from them as an artifact: the same
# build with the mobile config.json (scripts/mobile-bundle.js), synced by Capacitor, plus
# Capacitor's Android libraries. `apk` unpacks that over a checkout and runs Gradle, with no Node
# step of its own: see mobile/WRAPPER-PLAN.md. Before, the web image and the APK each ran their
# own `npm ci` and `vite build` on every merge.
#
# What a push does is decided in `plan`, from the paths it changes:
#
# - A push to RELEASE_BRANCH deploys the web client when a web path changed, and releases the
#   Android app when an app path changed. A change to this file does both. "Run workflow" on
#   RELEASE_BRANCH redeploys the web client by hand.
# - A push to any other branch is a check only: the web build and the image smoke test always,
#   and the Android project (unit tests and an unsigned, unminified APK) only when the branch
#   changes something native.
# - A `merge_group` run is the house merge queue testing a train (mouseion/forgejo, README "A merge
#   queue"): the scheduled pull requests merged onto RELEASE_BRANCH's newest commit, on the ref
#   `refs/merge-queue/heads/dev`. It is a check, never a release: the web build and the image
#   smoke test when the train changes any path above, the Android project when it changes
#   something native, and never a deploy, an F-Droid publish or a tag. What it changes is the diff
#   from the commit the train was built on (`merge_group.base_sha`). `merge_group:` takes no
#   `paths:`, so a train of README edits gets a run too: then only `plan` runs, and passes, since a
#   run whose every job was skipped fails the train. The release happens afterwards, as for any
#   merge: the train lands as one push to RELEASE_BRANCH, which runs this workflow as a push.
#
# Android versioning is automatic, not manual tags: a release computes the next semantic version
# from the latest `mobile-vX.Y.Z` tag and the commit messages since it. A `feat:` commit bumps
# minor, a `BREAKING CHANGE:` footer or a `!` after the type (`feat!:`, `fix!:`) bumps major,
# anything else (including this project's own informal `mobile: ...`/`web: ...` commits) bumps
# patch. The git tag itself is best-effort (see "Tag this release" below): it is never what
# triggers a release, only a record of one after the fact. versionCode is the Forgejo run number,
# which only ever increases, as F-Droid requires to offer the update. Branch pushes and trains
# use run numbers too, so releases skip numbers; nothing needs them consecutive. Release builds are
# R8-minified; the mapping is uploaded as an artifact so release crashes can be decoded.
#
# The web deploy follows the hub's one-build-and-deploy pattern (mouseion/hub ADR-0005), plus the
# forge's rule that the exact image is gated before it is pushed. Unlike the hub, which runs
# `:latest`, the deploy pins cinny to `<sha7>` in the compose file, so the file always records
# what is live and every backup is a rollback point. The stack's Watchtower watches every
# container, so a `:latest` line would also let it redeploy on its own.
#
# Runner facts this relies on (checked 2026-09-23, see issue #4; build lane 2026-10-12): `plan`
# runs on builder's light lane (`builder`) and `bundle` on builder's build lane (`builder-docker`:
# one build at a time, 7 CPUs and 14 GB at most, with a Docker daemon of its own), so nothing is
# built on server: the image reaches it through the registry and the Android inputs as an
# artifact. `homeserver` and `android` are :host labels on the one `forgejo-runner-server`
# container, which mounts the compose directory read-write and sits on `homeserver_default`, so
# it can reach the service as http://cinny/. It cannot reach https://iris.example.org over
# the tailnet, so the checks never use the public URL. The `android` job runs in the household
# android-build image (glibc, which aapt2 needs).
#
# Secrets: registry credentials are the ORG-level secret REGISTRY_TOKEN and variable
# REGISTRY_USER on org `mouseion`. Signing material is the repo secrets
# HOUSE_MOUSEION_CHAT_{KEYSTORE_BASE64,KEYSTORE_PASSWORD,KEY_ALIAS,KEY_PASSWORD}; the keystore is
# decoded into a private temp dir and removed afterwards.
name: build

on:
  push:
    branches: ['**']
    # Every path `plan` knows about; keep the two in step.
    paths:
      [
        'src/**',
        'public/**',
        'index.html',
        'config.json',
        'config.mobile.json',
        'vite.config.js',
        'build.config.ts',
        'tsconfig.json',
        'capacitor.config.ts',
        'package.json',
        'package-lock.json',
        '.npmrc',
        'netlify.toml',
        '.dockerignore',
        'Dockerfile',
        'docker-nginx.conf',
        'scripts/mobile-bundle.js',
        'mobile/**',
        'desktop/**',
        'branding/**',
        'scripts/iris-icons.py',
        '.forgejo/known_hosts',
        '.forgejo/workflows/build.yml',
      ]
  # Turns the house merge queue on for dev. Takes `branches:` only, no `paths:`.
  merge_group:
    branches: [dev]
  workflow_dispatch:

# On a branch a newer push makes an older run moot. On dev every run finishes: a release is not
# cancelled half-published, and deploys land in the order of the pushes. A train's run finishes
# too, queued behind the one before it: the queue tests one train at a time, so a second run is
# only a train built again, and a cancelled run counts as a failure that takes the pull requests
# out of the queue. Trains have their own group (the ref is refs/merge-queue/heads/dev), so they
# never wait on dev's releases.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.event_name != 'merge_group' }}

env:
  IMAGE: forgejo.example.org/mouseion/iris-web
  # The branch that deploys and releases. `dev` is the fork's one trunk (owner decision,
  # 2026-09-23), and upstream Cinny merges land there too.
  RELEASE_BRANCH: dev

jobs:
  plan:
    runs-on: builder
    defaults:
      run:
        shell: bash
    outputs:
      build: ${{ steps.what.outputs.build }}
      deploy: ${{ steps.what.outputs.deploy }}
      android: ${{ steps.what.outputs.android }}
      desktop: ${{ steps.what.outputs.desktop }}
      publish: ${{ steps.what.outputs.publish }}
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the diff below and the version step need the commits and every
          # `mobile-v*` tag, which a shallow clone would not have. A train's commit is on no branch,
          # and at depth 0 the action fetches branches and tags only, so a train checks out its
          # commit alone and fetches the history in the next step (mouseion/forgejo README, "A
          # merge queue").
          fetch-depth: ${{ github.event_name == 'merge_group' && 1 || 0 }}

      - name: History of a train
        if: github.event_name == 'merge_group'
        run: git fetch --unshallow --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: What this push does
        id: what
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # Served by the web client.
          web='^(src/|public/|index\.html$|config\.json$|vite\.config\.js$|build\.config\.ts$|tsconfig\.json$|package\.json$|package-lock\.json$|\.npmrc$|netlify\.toml$|\.dockerignore$|Dockerfile$|docker-nginx\.conf$|\.forgejo/workflows/build\.yml$)'
          # Shipped in the Android app.
          app='^(src/|public/|index\.html$|config\.mobile\.json$|vite\.config\.js$|build\.config\.ts$|tsconfig\.json$|capacitor\.config\.ts$|package\.json$|package-lock\.json$|scripts/mobile-bundle\.js$|mobile/|\.forgejo/workflows/build\.yml$)'
          # What Gradle compiles or packages besides the web build.
          native='^(mobile/android/|capacitor\.config\.ts$|package\.json$|package-lock\.json$|scripts/mobile-bundle\.js$|\.forgejo/workflows/build\.yml$)'

          # The Linux desktop shell: its Nix package and the artwork it embeds.
          desktop_paths='^(desktop/|branding/|scripts/iris-icons\.py$|\.forgejo/known_hosts$|\.forgejo/workflows/build\.yml$)'

          # `build` is false when the change touches no web or app path (a desktop-only push or
          # train). "Run workflow" always builds.
          build=true; deploy=false; android=false; publish=false; desktop=false
          if [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            # A train: what it brings in since the commit of RELEASE_BRANCH it was built on.
            # Without that commit, everything counts. Never a deploy or a release.
            if [[ ! "$BASE" =~ ^[0-9a-f]+$ ]] || ! changed="$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null)"; then
              changed="$(git ls-files)"
            fi
            if ! grep -qE "$web|$app" <<< "$changed"; then build=false; fi
            if grep -qE "$native" <<< "$changed"; then android=true; fi
            if grep -qE "$desktop_paths" <<< "$changed"; then desktop=true; fi
          elif [[ "$GITHUB_REF" == "refs/heads/$RELEASE_BRANCH" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              deploy=true
            else
              # What the push brought in. Without a usable previous head, everything counts.
              if [[ "$BEFORE" =~ ^0*$ ]] || ! changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null)"; then
                changed="$(git ls-files)"
              fi
              if grep -qE "$web" <<< "$changed"; then deploy=true; fi
              if grep -qE "$app" <<< "$changed"; then android=true; publish=true; fi
              if grep -qE "$desktop_paths" <<< "$changed"; then desktop=true; fi
              if ! grep -qE "$web|$app" <<< "$changed"; then build=false; fi
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            git fetch --quiet origin "$RELEASE_BRANCH"
            changed="$(git diff --name-only "origin/$RELEASE_BRANCH...HEAD")"
            if grep -qE "$native" <<< "$changed"; then android=true; fi
            if grep -qE "$desktop_paths" <<< "$changed"; then desktop=true; fi
            if ! grep -qE "$web|$app" <<< "$changed"; then build=false; fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            desktop=true
          fi
          echo "build=$build deploy=$deploy android=$android publish=$publish desktop=$desktop"
          { echo "build=$build"; echo "deploy=$deploy"; echo "android=$android"; echo "publish=$publish"; echo "desktop=$desktop"; } >> "$GITHUB_OUTPUT"

      - name: Version — the next semantic release, or a build-only marker
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force > /dev/null 2>&1 || true

          if [[ "${{ steps.what.outputs.publish }}" == "true" ]]; then
            latest="$(git tag -l 'mobile-v*' | grep -E '^mobile-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
            lmajor=0; lminor=0
            if [[ -n "$latest" ]]; then
              IFS=. read -r lmajor lminor _ <<< "${latest#mobile-v}"
            fi
            if [[ -z "$latest" ]] || (( lmajor == 0 && lminor < 4 )); then
              # First release of the Capacitor wrapper (mobile/WRAPPER-PLAN.md). There is an old
              # clean mobile-v0.1.1 tag from the very first Compose bring-up (everything since used
              # -rcN suffixes, so this loop never saw them as "latest") — the Compose app's last
              # version was 0.3.0, so the wrapper starts fresh at 0.4.0 rather than bumping 0.1.1.
              next="0.4.0"
            else
              msgs="$(git log --format=%B "$latest..HEAD")"
              bump=patch
              if echo "$msgs" | grep -qiE '^BREAKING CHANGE:'; then
                bump=major
              elif echo "$msgs" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then
                bump=major
              elif echo "$msgs" | grep -qE '^feat(\([^)]*\))?:'; then
                bump=minor
              fi
              IFS=. read -r major minor patch <<< "${latest#mobile-v}"
              case "$bump" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
              esac
              next="$major.$minor.$patch"
            fi
            echo "name=$next" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  bundle:
    needs: [plan]
    if: needs.plan.outputs.build == 'true'
    runs-on: builder-docker
    steps:
      - uses: actions/checkout@v4

      - name: Login to Forgejo Packages
        if: needs.plan.outputs.deploy == 'true'
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login forgejo.example.org -u "${{ vars.REGISTRY_USER }}" --password-stdin

      # The one `npm ci` + `vite build` of the run, in the image's builder stage.
      - name: Build the web image
        run: docker buildx build --platform linux/amd64 --load --tag "$IMAGE:${GITHUB_SHA:0:7}" .

      # Gate before publishing: the exact image must serve the app shell and the frame-ancestors
      # header that the hub's chat spoke (mouseion/hub#51) depends on. Checked from inside the
      # container, so no port or network is involved.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          name="iris-web-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" "$IMAGE:${GITHUB_SHA:0:7}" >/dev/null
          headers=""
          for _ in $(seq 1 15); do
            if headers=$(docker exec "$name" wget -qS -O /dev/null http://127.0.0.1/ 2>&1); then break; fi
            sleep 1
          done
          echo "$headers"
          echo "$headers" | grep -qi 'content-security-policy:.*frame-ancestors' \
            || { echo "image does not serve the frame-ancestors header" >&2; exit 1; }
          docker exec "$name" wget -q -O - http://127.0.0.1/ | grep -q '<div id="root"' \
            || { echo "image does not serve the app shell" >&2; exit 1; }

      # The same build and node_modules, out of the layer cache, as files for the Android job
      # (the Dockerfile's `android` stage).
      - name: Export the Android inputs
        if: needs.plan.outputs.android == 'true'
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --target android --output type=local,dest=android-inputs .
          test -f android-inputs/mobile/android/app/src/main/assets/public/index.html
          tar -czf android-inputs.tgz -C android-inputs .

      - uses: actions/upload-artifact@v3
        if: needs.plan.outputs.android == 'true'
        with:
          name: android-inputs
          path: android-inputs.tgz

      - name: Push
        if: needs.plan.outputs.deploy == 'true' && github.event_name != 'merge_group'
        run: |
          set -euo pipefail
          docker tag "$IMAGE:${GITHUB_SHA:0:7}" "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA:0:7}"
          docker push "$IMAGE:latest"

  # The Linux desktop shell (desktop/, mouseion/iris#65): a check only, nothing is published. It
  # builds the Nix package and runs its Qt Test suites, on builder's Nix lane (the host's Nix),
  # against the nixpkgs that household/nix-config's `main` locks for its root input, read from
  # that branch's flake.lock on every run (desktop/nix/ci.nix, mouseion/iris#79). Nothing in this
  # repo copies the pin, and the check follows `main`, not whatever Builder last switched to: if
  # Builder runs an older nixpkgs, Builder needs to switch. Iris's CI owns the build and the
  # packaging; nix-config only installs the result.
  #
  # nix-config is private. NIX_CONFIG_READ_KEY is the private half of a read-only deploy key on it
  # (deploy key 7), used the way nix-config's own workflows use TV_BOX_INPUTS_KEY: a 0600 file
  # under /dev/shm, never in the workspace, removed at the end even when a step fails, and ssh that
  # trusts only the host key in .forgejo/known_hosts.
  desktop:
    runs-on: builder-nix
    needs: [plan]
    if: needs.plan.outputs.desktop == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Key
        env:
          READ_KEY: ${{ secrets.NIX_CONFIG_READ_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$READ_KEY" ]; then
            echo "the secret NIX_CONFIG_READ_KEY is not set: the desktop check cannot read household/nix-config's flake.lock" >&2
            exit 1
          fi
          keys=$(mktemp -d -p /dev/shm iris-desktop.XXXXXX)
          (umask 077; printf '%s\n' "$READ_KEY" >"$keys/nix-config")
          ssh_options="-o IdentitiesOnly=yes -o IdentityAgent=none -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$PWD/.forgejo/known_hosts"
          {
            echo "KEYS=$keys"
            echo "GIT_SSH_COMMAND=ssh -i $keys/nix-config $ssh_options"
          } >>"$GITHUB_ENV"

      - name: nix-config main's nixpkgs
        run: |
          set -euo pipefail
          # Outside the workspace; only flake.lock is kept from the fetch.
          lock=$(mktemp -d)
          echo "LOCK=$lock" >>"$GITHUB_ENV"
          git -C "$lock" init -q
          git -C "$lock" fetch -q --depth 1 ssh://git@forgejo.example.org:2222/household/nix-config main
          git -C "$lock" show FETCH_HEAD:flake.lock >"$lock/flake.lock"
          echo "nix-config: main at $(git -C "$lock" rev-parse FETCH_HEAD)"
          echo "nixpkgs: $(nix eval --raw -f desktop/nix/ci.nix --arg lock "$lock/flake.lock" nixpkgs)"

      - name: Build the package and run its tests
        run: |
          nix-build --no-out-link --cores 12 --max-jobs 2 desktop/nix/ci.nix -A package \
            --arg lock "$LOCK/flake.lock"

      - name: Remove the key
        if: always()
        run: |
          if [ -n "${KEYS-}" ]; then rm -rf "$KEYS"; fi
          if [ -n "${LOCK-}" ]; then rm -rf "$LOCK"; fi

  deploy:
    needs: [plan, bundle]
    # `plan` never says deploy for a train; said again here because this job changes what is live.
    if: needs.plan.outputs.deploy == 'true' && github.event_name != 'merge_group'
    runs-on: homeserver
    env:
      COMPOSE_FILE: /home/user/homeserver/docker-compose.yml
    steps:
      # House convention (the .bak.* files beside it): back up before editing, as the 2026-09-18
      # hand deploy did. Only the newest 10 of this workflow's backups are kept.
      - name: Back up the compose file
        run: |
          set -euo pipefail
          cp -a "$COMPOSE_FILE" "$COMPOSE_FILE.bak.iris-web-$(date +%Y%m%d-%H%M%S)"
          ls -t "$COMPOSE_FILE".bak.iris-web-* | tail -n +11 | xargs -r rm --

      # Pin the cinny service's image line to the new tag. The pattern matches iris-web and the
      # names the image had before Iris (mouseion-chat-web, chat-web), so the first deploy after the
      # rename moves the line over. The edit is checked in a temp file and then written back into
      # the same file rather than renamed over it, in case anything bind-mounts this one file. The
      # registry domain is mouseion.house: example.net is no longer used (#58).
      - name: Pin the cinny service to the new image
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA:0:7}"
          tmp="$(mktemp "$COMPOSE_FILE.deploy-web.XXXXXX")"
          trap 'rm -f "$tmp"' EXIT
          sed -E \
            -e "s#^([[:space:]]+image: )(mouseion-chat-web|forgejo\.example\.org/mouseion/(chat|iris)-web):.*#\1$IMAGE:${sha}  \# pinned by mouseion/iris .forgejo/workflows/build.yml#" \
            "$COMPOSE_FILE" > "$tmp"
          test "$(grep -c "image: $IMAGE:${sha}  # pinned by" "$tmp")" = 1 \
            || { echo "expected exactly one cinny image line to update; aborting before touching anything" >&2; exit 1; }
          docker compose -f "$tmp" --project-directory "$(dirname "$COMPOSE_FILE")" config -q
          cat "$tmp" > "$COMPOSE_FILE"

      # Each deploy pins a new :<sha>, so the replaced image is tagged with its old sha: same-repository removes it.
      - name: Pull and restart
        uses: https://forgejo.example.org/mouseion/common/actions/compose-deploy@da24f1a359c36b76c0635d1b5c0b1ef2bfe42ac8 # v1.0.0
        with:
          service: cinny
          compose-file: ${{ env.COMPOSE_FILE }}
          replaced-tags: same-repository

      # Success means the running container is on the new image and serves the header. Checked
      # by service name on the compose network: the public URL is unreachable from this runner.
      - name: Verify the running service
        run: |
          set -euo pipefail
          running="$(docker inspect cinny --format '{{.Config.Image}}')"
          test "$running" = "$IMAGE:${GITHUB_SHA:0:7}" \
            || { echo "cinny is running $running, not $IMAGE:${GITHUB_SHA:0:7}" >&2; exit 1; }
          for _ in $(seq 1 15); do
            if curl -sfI http://cinny/ | grep -qi 'content-security-policy:.*frame-ancestors'; then
              exit 0
            fi
            sleep 2
          done
          echo "cinny does not serve the frame-ancestors header after the restart" >&2
          exit 1

  apk:
    needs: [plan, bundle]
    if: needs.plan.outputs.android == 'true'
    runs-on: android
    container:
      # Hardcoded: the DOMAIN/REGISTRY_USER Actions variables exist on the forge repo, not here.
      # Node 22, Android SDK 36, and JDK 21 beside the default 17 (server:
      # ~/homeserver/android-build/Dockerfile).
      image: forgejo.example.org/household/android-build:jdk17-jdk21-sdk36-bun
      volumes:
        - forge-gradle-cache:/gradle-cache
    defaults:
      run:
        shell: bash
    env:
      GRADLE_USER_HOME: /gradle-cache
      # @capacitor/android 8 requires source/target 21 (`invalid source release: 21` under 17).
      JAVA_HOME: /opt/java/jdk21
      VERSION_NAME: ${{ needs.plan.outputs.name }}
      VERSION_CODE: ${{ needs.plan.outputs.code }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v3
        with:
          name: android-inputs
          path: ./android-inputs

      # The synced mobile bundle and Capacitor's Android libraries, from `bundle`, unpacked over
      # the checkout.
      - name: Android inputs (into the Android project)
        run: |
          set -euo pipefail
          tar -xzf android-inputs/android-inputs.tgz
          rm -r android-inputs
          grep -q mouseion.house mobile/android/app/src/main/assets/public/config.json
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > mobile/android/local.properties

      - name: Decode signing keystore
        if: needs.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          d="$(mktemp -d)"; chmod 700 "$d"
          printf '%s' "${{ secrets.HOUSE_MOUSEION_CHAT_KEYSTORE_BASE64 }}" | base64 -d > "$d/release.jks"
          chmod 600 "$d/release.jks"
          echo "MOUSEION_KEYSTORE_PATH=$d/release.jks" >> "$GITHUB_ENV"

      # A release APK is built whenever the Android project is, so breakage in the Gradle/Capacitor
      # wiring shows up early; it is only signed (and only R8-minified) when it will actually be
      # published. The unit tests (PushSummaryTest, PushHistoryTest) run first and gate the release.
      - name: Unit tests and release APK
        working-directory: mobile/android
        env:
          MOUSEION_KEYSTORE_PASSWORD: ${{ secrets.HOUSE_MOUSEION_CHAT_KEYSTORE_PASSWORD }}
          MOUSEION_KEY_ALIAS: ${{ secrets.HOUSE_MOUSEION_CHAT_KEY_ALIAS }}
          MOUSEION_KEY_PASSWORD: ${{ secrets.HOUSE_MOUSEION_CHAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :app:testReleaseUnitTest :app:assembleRelease \
            -PmouseionMinify="$PUBLISH" -PversionCode="$VERSION_CODE" -PmouseionVersionName="$VERSION_NAME"
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$apk" "../house.mouseion.iris-$VERSION_NAME.apk"
          if [[ "$PUBLISH" == "true" ]]; then
            APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
            "$APKSIGNER" verify --print-certs "../house.mouseion.iris-$VERSION_NAME.apk" | grep -E "certificate DN|SHA-256"
          fi

      - name: Remove keystore
        if: always() && needs.plan.outputs.publish == 'true'
        run: rm -rf "$(dirname "$MOUSEION_KEYSTORE_PATH")"

      # Best-effort only: nothing above depended on a git tag existing, and nothing below does
      # either (F-Droid publishing uses the computed name/code directly). This just leaves a
      # human-readable marker in the repo's history for a release that already happened. If the
      # checkout's token turns out not to have push access on this instance, this step fails
      # loudly in the log but never fails the run.
      - name: Tag this release in git (best-effort)
        if: needs.plan.outputs.publish == 'true' && github.event_name != 'merge_group'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "mouseion-ci"
          git config user.email "ci@mouseion.house"
          git tag -a "mobile-v$VERSION_NAME" -m "mobile-v$VERSION_NAME (auto-released by run $VERSION_CODE)"
          git push origin "mobile-v$VERSION_NAME"

      - name: Compress R8 mapping
        if: needs.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          gzip -c mobile/android/app/build/outputs/mapping/release/mapping.txt > "mobile/house.mouseion.iris-mapping-$VERSION_NAME.txt.gz"

      - uses: actions/upload-artifact@v3
        with:
          name: mouseion-apk
          path: mobile/house.mouseion.iris-${{ needs.plan.outputs.name }}.apk

      - uses: actions/upload-artifact@v3
        if: needs.plan.outputs.publish == 'true'
        with:
          name: mouseion-mapping
          path: mobile/house.mouseion.iris-mapping-${{ needs.plan.outputs.name }}.txt.gz

  publish-fdroid:
    needs: [plan, apk]
    # As for `deploy`: `plan` never says publish for a train.
    if: needs.plan.outputs.publish == 'true' && github.event_name != 'merge_group'
    runs-on: homeserver
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: mouseion-apk
          path: ./apk

      # The house publish, shared with media, ada and forge (mouseion/common#12).
      - name: Publish to F-Droid repo
        uses: https://forgejo.example.org/mouseion/common/actions/fdroid-publish@47adab754fecf1183f6068810961cfa2eeb345bc # v1.0.1
        with:
          apk: ./apk/house.mouseion.iris-${{ needs.plan.outputs.name }}.apk
          app-id: house.mouseion.iris
          mark-current: 'true'
          version-code: ${{ needs.plan.outputs.code }}
          version-name: ${{ needs.plan.outputs.name }}
