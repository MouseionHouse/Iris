# Iris: one build of the web app per push, used for everything that ships.
#
#   plan ── bundle ──┬── deploy                  (RELEASE_BRANCH: the web client, by compose on the host)
#                    └── apk ── publish-fdroid   (RELEASE_BRANCH: the Android app, into an F-Droid repo)
#   plan ── desktop                              (check only: the Nix package of the Linux desktop shell)
#   plan ── macos                                (the macOS desktop shell: tests, and Iris.app as an artifact)
#
# `bundle` runs the one `npm ci` and `vite build` of a push, inside the Docker image that serves
# the web client, and exports what the Android project needs from them as an artifact: the same
# build with the mobile config.json (scripts/mobile-bundle.js), synced by Capacitor, plus
# Capacitor's Android libraries. `apk` unpacks that over a checkout and runs Gradle, with no Node
# step of its own: see mobile/WRAPPER-PLAN.md.
#
# What a push does is decided in `plan`, from the paths it changes:
#
# - A push to RELEASE_BRANCH deploys the web client when a web path changed, and releases the
#   Android app when an app path changed. A change to this file does both. "Run workflow" on
#   RELEASE_BRANCH redeploys the web client by hand.
# - A push to any other branch is a check only: the web build and the image smoke test always,
#   and the Android project (unit tests and an unsigned, unminified APK) only when the branch
#   changes something native.
# - A `merge_group` run is the forge's merge queue testing a train: the scheduled pull requests
#   merged onto RELEASE_BRANCH's newest commit, on the ref `refs/merge-queue/heads/dev`. It is a
#   check, never a release: the web build and the image smoke test when the train changes any
#   path above, the Android project when it changes something native, and never a deploy, an
#   F-Droid publish or a tag. What it changes is the diff from the commit the train was built on
#   (`merge_group.base_sha`). `merge_group:` takes no `paths:`, so a train of README edits gets a
#   run too: then only `plan` runs, and passes, since a run whose every job was skipped fails the
#   train. The release happens afterwards, as for any merge: the train lands as one push to
#   RELEASE_BRANCH, which runs this workflow as a push.
#
# Android versioning is automatic, not manual tags: a release computes the next semantic version
# from the latest `mobile-vX.Y.Z` tag and the commit messages since it. A `feat:` commit bumps
# minor, a `BREAKING CHANGE:` footer or a `!` after the type (`feat!:`, `fix!:`) bumps major,
# anything else (including this project's own informal `mobile: ...`/`web: ...` commits) bumps
# patch. The git tag itself is best-effort (see "Tag this release" below): it is never what
# triggers a release, only a record of one after the fact. versionCode is the run number, which
# only ever increases, as F-Droid requires to offer the update. Branch pushes and trains use run
# numbers too, so releases skip numbers; nothing needs them consecutive. Release builds are
# R8-minified; the mapping is uploaded as an artifact so release crashes can be decoded.
#
# The web deploy builds once and deploys that build, and the exact image is gated by a smoke test
# before it is pushed. The deploy pins the service to `<sha7>` in the compose file rather than
# `:latest`, so the file always records what is live, every backup is a rollback point, and
# nothing that watches `:latest` can redeploy on its own.
#
# Runners, by label: `mouseion-docker` for light jobs and the Android build, `mouseion-build` for
# the image (with a Docker daemon of its own), `mouseion-nix` for the desktop check (with Nix),
# `mouseion-macos` for the macOS shell (a Mac, jobs run on the host with Xcode, one at a time),
# and `mouseion-deploy` for the two release jobs, which runs on the deployment host: it can run
# docker there, read and write the compose file and the F-Droid repos at their host paths, and
# reach the service by name on the compose network. Nothing is built on the deployment host: the
# image reaches it through the registry and the APK as an artifact.
#
# Where the deployment lives is not in this file. These are Actions variables on the repository
# (and REGISTRY_USER on its organization), and a job that needs one stops if it is unset:
#
#   REGISTRY             the container registry the image is pushed to, e.g. registry.example.org
#   IMAGE                the web image, without a tag, e.g. registry.example.org/owner/iris-web
#   COMPOSE_FILE         the compose file on the deployment host that runs the web client
#   DEPLOY_SERVICE       the web client's service in it (and its container name)
#   ANDROID_BUILD_IMAGE  the image the Android build runs in: Node, the Android SDK, JDK 17 and 21
#   FDROID_APPDATA       the directory on the deployment host that holds the F-Droid repos
#   FDROID_REPO          the repo under it to publish into
#   NIX_CONFIG_URL       the git URL (ssh) of the NixOS configuration the desktop check follows
#   FORGE_KNOWN_HOSTS    the known_hosts line(s) of that URL's ssh host
#   IRIS_DESKTOP_URL     the Iris web app the macOS shell opens, https://host[:port]
#   IRIS_*               the build settings (README, "Configure it")
#
# Secrets: the registry token is the organization secret REGISTRY_TOKEN. Signing material is the
# repo secrets HOUSE_MOUSEION_CHAT_{KEYSTORE_BASE64,KEYSTORE_PASSWORD,KEY_ALIAS,KEY_PASSWORD}; the
# keystore is decoded into a private temp dir and removed afterwards. NIX_CONFIG_READ_KEY is the
# desktop check's read-only ssh key.
name: build

on:
  push:
    branches: ['**']
    # Every path `plan` knows about; keep the two in step.
    paths:
      [
        'src/**',
        'public/**',
        'index.html',
        'config.json',
        'config.mobile.json',
        'vite.config.js',
        'build.config.ts',
        'tsconfig.json',
        'capacitor.config.ts',
        'package.json',
        'package-lock.json',
        '.npmrc',
        '.dockerignore',
        'Dockerfile',
        'docker-nginx.conf',
        'scripts/mobile-bundle.js',
        'scripts/nginx-conf.js',
        'test/**',
        'eslint.config.js',
        '.prettierrc.json',
        '.prettierignore',
        'mobile/**',
        'desktop/**',
        'branding/**',
        'scripts/iris-icons.py',
        'desktop-macos/**',
        '.forgejo/actions/**',
        '.forgejo/workflows/build.yml',
      ]
  # Turns the forge's merge queue on for dev. Takes `branches:` only, no `paths:`.
  merge_group:
    branches: [dev]
  workflow_dispatch:

# On a branch a newer push makes an older run moot. On dev every run finishes: a release is not
# cancelled half-published, and deploys land in the order of the pushes. A train's run finishes
# too, queued behind the one before it: the queue tests one train at a time, so a second run is
# only a train built again, and a cancelled run counts as a failure that takes the pull requests
# out of the queue. Trains have their own group (the ref is refs/merge-queue/heads/dev), so they
# never wait on dev's releases.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.event_name != 'merge_group' }}

env:
  IMAGE: ${{ vars.IMAGE }}
  # The branch that deploys and releases. `dev` is the fork's one trunk, and upstream Cinny merges
  # land there too.
  RELEASE_BRANCH: dev

jobs:
  plan:
    runs-on: mouseion-docker
    defaults:
      run:
        shell: bash
    outputs:
      build: ${{ steps.what.outputs.build }}
      deploy: ${{ steps.what.outputs.deploy }}
      android: ${{ steps.what.outputs.android }}
      desktop: ${{ steps.what.outputs.desktop }}
      macos: ${{ steps.what.outputs.macos }}
      publish: ${{ steps.what.outputs.publish }}
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the diff below and the version step need the commits and every
          # `mobile-v*` tag, which a shallow clone would not have. A train's commit is on no branch,
          # and at depth 0 the action fetches branches and tags only, so a train checks out its
          # commit alone and fetches the history in the next step.
          fetch-depth: ${{ github.event_name == 'merge_group' && 1 || 0 }}

      - name: History of a train
        if: github.event_name == 'merge_group'
        run: git fetch --unshallow --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: What this push does
        id: what
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # Served by the web client.
          web='^(src/|public/|index\.html$|config\.json$|vite\.config\.js$|build\.config\.ts$|tsconfig\.json$|package\.json$|package-lock\.json$|\.npmrc$|\.dockerignore$|Dockerfile$|docker-nginx\.conf$|scripts/nginx-conf\.js$|\.forgejo/actions/compose-deploy/|\.forgejo/workflows/build\.yml$)'
          # Shipped in the Android app.
          app='^(src/|public/|index\.html$|config\.mobile\.json$|vite\.config\.js$|build\.config\.ts$|tsconfig\.json$|capacitor\.config\.ts$|package\.json$|package-lock\.json$|scripts/mobile-bundle\.js$|mobile/|\.forgejo/actions/fdroid-publish/|\.forgejo/workflows/build\.yml$)'
          # What Gradle compiles or packages besides the web build.
          native='^(mobile/android/|capacitor\.config\.ts$|package\.json$|package-lock\.json$|scripts/mobile-bundle\.js$|\.forgejo/workflows/build\.yml$)'

          # Read by the Dockerfile's `check` stage only: a change here builds, to check, but
          # deploys and releases nothing.
          checks='^(test/|eslint\.config\.js$|\.prettierrc\.json$|\.prettierignore$)'

          # The Linux desktop shell: its Nix package and the artwork it embeds.
          desktop_paths='^(desktop/|branding/|scripts/iris-icons\.py$|\.forgejo/workflows/build\.yml$)'
          # The macOS desktop shell, and the bridge contract it shares with the Linux one.
          macos_paths='^(desktop-macos/|desktop/BRIDGE\.md$|\.forgejo/workflows/build\.yml$)'

          # `build` is false when the change touches no web, app or checks path (a desktop-only push
          # or train). "Run workflow" always builds.
          build=true; deploy=false; android=false; publish=false; desktop=false; macos=false
          if [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            # A train: what it brings in since the commit of RELEASE_BRANCH it was built on.
            # Without that commit, everything counts. Never a deploy or a release.
            if [[ ! "$BASE" =~ ^[0-9a-f]+$ ]] || ! changed="$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null)"; then
              changed="$(git ls-files)"
            fi
            if ! grep -qE "$web|$app|$checks" <<< "$changed"; then build=false; fi
            if grep -qE "$native" <<< "$changed"; then android=true; fi
            if grep -qE "$desktop_paths" <<< "$changed"; then desktop=true; fi
            if grep -qE "$macos_paths" <<< "$changed"; then macos=true; fi
          elif [[ "$GITHUB_REF" == "refs/heads/$RELEASE_BRANCH" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              deploy=true
            else
              # What the push brought in. Without a usable previous head, everything counts.
              if [[ "$BEFORE" =~ ^0*$ ]] || ! changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null)"; then
                changed="$(git ls-files)"
              fi
              if grep -qE "$web" <<< "$changed"; then deploy=true; fi
              if grep -qE "$app" <<< "$changed"; then android=true; publish=true; fi
              if grep -qE "$desktop_paths" <<< "$changed"; then desktop=true; fi
              if grep -qE "$macos_paths" <<< "$changed"; then macos=true; fi
              if ! grep -qE "$web|$app|$checks" <<< "$changed"; then build=false; fi
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            git fetch --quiet origin "$RELEASE_BRANCH"
            changed="$(git diff --name-only "origin/$RELEASE_BRANCH...HEAD")"
            if grep -qE "$native" <<< "$changed"; then android=true; fi
            if grep -qE "$desktop_paths" <<< "$changed"; then desktop=true; fi
            if grep -qE "$macos_paths" <<< "$changed"; then macos=true; fi
            if ! grep -qE "$web|$app|$checks" <<< "$changed"; then build=false; fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            desktop=true; macos=true
          fi
          echo "build=$build deploy=$deploy android=$android publish=$publish desktop=$desktop macos=$macos"
          { echo "build=$build"; echo "deploy=$deploy"; echo "android=$android"; echo "publish=$publish"; echo "desktop=$desktop"; echo "macos=$macos"; } >> "$GITHUB_OUTPUT"

      - name: Version — the next semantic release, or a build-only marker
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force > /dev/null 2>&1 || true

          if [[ "${{ steps.what.outputs.publish }}" == "true" ]]; then
            latest="$(git tag -l 'mobile-v*' | grep -E '^mobile-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
            lmajor=0; lminor=0
            if [[ -n "$latest" ]]; then
              IFS=. read -r lmajor lminor _ <<< "${latest#mobile-v}"
            fi
            if [[ -z "$latest" ]] || (( lmajor == 0 && lminor < 4 )); then
              # First release of the Capacitor wrapper (mobile/WRAPPER-PLAN.md). An older native
              # app reached 0.3.0, and one of its early tags is a clean mobile-v0.1.1, so the
              # wrapper starts at 0.4.0 rather than bumping that.
              next="0.4.0"
            else
              msgs="$(git log --format=%B "$latest..HEAD")"
              bump=patch
              if echo "$msgs" | grep -qiE '^BREAKING CHANGE:'; then
                bump=major
              elif echo "$msgs" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then
                bump=major
              elif echo "$msgs" | grep -qE '^feat(\([^)]*\))?:'; then
                bump=minor
              fi
              IFS=. read -r major minor patch <<< "${latest#mobile-v}"
              case "$bump" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
              esac
              next="$major.$minor.$patch"
            fi
            echo "name=$next" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  bundle:
    needs: [plan]
    if: needs.plan.outputs.build == 'true'
    runs-on: mouseion-build
    # The deployment's values, which the code does not carry (README, "Configure it"): repo
    # Actions variables. The two hub settings are Docker build args, read from here by
    # `--build-arg NAME`; the mobile config is written over config.mobile.json.
    env:
      HUB_ORIGINS: ${{ vars.IRIS_HUB_ORIGINS }}
      HUB_PREVIEW_PATTERN: ${{ vars.IRIS_HUB_PREVIEW_PATTERN }}
      CONFIG_MOBILE_JSON: ${{ vars.IRIS_CONFIG_MOBILE_JSON }}
    steps:
      - uses: actions/checkout@v4

      # Without them the build would be the public one: no hub framing, and an Android app that
      # offers any homeserver. Better to stop than to ship that to the deployment.
      - name: The deployment's build settings
        shell: bash
        run: |
          set -euo pipefail
          for name in HUB_ORIGINS HUB_PREVIEW_PATTERN CONFIG_MOBILE_JSON; do
            if [ -z "${!name:-}" ]; then
              echo "the repo variable IRIS_$name is not set: this would build the public defaults" >&2
              exit 1
            fi
          done
          if [ -z "$IMAGE" ]; then
            echo "the repo variable IMAGE is not set" >&2
            exit 1
          fi
          printf '%s\n' "$CONFIG_MOBILE_JSON" > config.mobile.json

      - name: Login to the registry
        if: needs.plan.outputs.deploy == 'true'
        env:
          REGISTRY: ${{ vars.REGISTRY }}
        run: |
          set -euo pipefail
          if [ -z "$REGISTRY" ]; then
            echo "the repo variable REGISTRY is not set" >&2
            exit 1
          fi
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ vars.REGISTRY_USER }}" --password-stdin

      # tsc, ESLint, Prettier and `npm test` (the Dockerfile's `check` stage), on the builder
      # stage's `npm ci` and build. A failure stops the run before anything is built to ship.
      - name: Check types, lint and tests
        run: |
          docker buildx build --platform linux/amd64 --build-arg HUB_ORIGINS --build-arg HUB_PREVIEW_PATTERN \
            --target check --progress plain .

      # The one `npm ci` + `vite build` of the run, in the image's builder stage.
      - name: Build the web image
        run: |
          docker buildx build --platform linux/amd64 --build-arg HUB_ORIGINS --build-arg HUB_PREVIEW_PATTERN \
            --load --tag "$IMAGE:${GITHUB_SHA:0:7}" .

      # Gate before publishing: the exact image must serve the app shell and the frame-ancestors
      # header that lets each IRIS_HUB_ORIGINS origin frame it. Checked from inside the container,
      # so no port or network is involved.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          name="iris-web-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" "$IMAGE:${GITHUB_SHA:0:7}" >/dev/null
          headers=""
          for _ in $(seq 1 15); do
            if headers=$(docker exec "$name" wget -qS -O /dev/null http://127.0.0.1/ 2>&1); then break; fi
            sleep 1
          done
          echo "$headers"
          echo "$headers" | grep -qi 'content-security-policy:.*frame-ancestors' \
            || { echo "image does not serve the frame-ancestors header" >&2; exit 1; }
          for origin in $HUB_ORIGINS; do
            echo "$headers" | grep -i 'content-security-policy:' | grep -qF " $origin" \
              || { echo "image does not let $origin frame it" >&2; exit 1; }
          done
          docker exec "$name" wget -q -O - http://127.0.0.1/ | grep -q '<div id="root"' \
            || { echo "image does not serve the app shell" >&2; exit 1; }

      # The same build and node_modules, out of the layer cache, as files for the Android job
      # (the Dockerfile's `android` stage).
      - name: Export the Android inputs
        if: needs.plan.outputs.android == 'true'
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --build-arg HUB_ORIGINS --build-arg HUB_PREVIEW_PATTERN \
            --target android --output type=local,dest=android-inputs .
          test -f android-inputs/mobile/android/app/src/main/assets/public/index.html
          tar -czf android-inputs.tgz -C android-inputs .

      - uses: actions/upload-artifact@v3
        if: needs.plan.outputs.android == 'true'
        with:
          name: android-inputs
          path: android-inputs.tgz

      - name: Push
        if: needs.plan.outputs.deploy == 'true' && github.event_name != 'merge_group'
        run: |
          set -euo pipefail
          docker tag "$IMAGE:${GITHUB_SHA:0:7}" "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA:0:7}"
          docker push "$IMAGE:latest"

  # The Linux desktop shell (desktop/): a check only, nothing is published. It builds the Nix
  # package and runs its Qt Test suites, with the runner host's Nix, against the nixpkgs that the
  # NixOS configuration at NIX_CONFIG_URL locks on `main` for its root input, read from that
  # branch's flake.lock on every run (desktop/nix/ci.nix). Nothing in this repo copies the pin, and
  # the check follows `main`, not whatever a machine last switched to. Iris's CI owns the build and
  # the packaging; the configuration only installs the result.
  #
  # The configuration is private. NIX_CONFIG_READ_KEY is the private half of a read-only deploy key
  # on it: a 0600 file under /dev/shm, never in the workspace, removed at the end even when a step
  # fails, and ssh that trusts only the host key in FORGE_KNOWN_HOSTS, written beside it.
  desktop:
    runs-on: mouseion-nix
    needs: [plan]
    if: needs.plan.outputs.desktop == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Key
        env:
          READ_KEY: ${{ secrets.NIX_CONFIG_READ_KEY }}
          KNOWN_HOSTS: ${{ vars.FORGE_KNOWN_HOSTS }}
          NIX_CONFIG_URL: ${{ vars.NIX_CONFIG_URL }}
        run: |
          set -euo pipefail
          if [ -z "$READ_KEY" ]; then
            echo "the secret NIX_CONFIG_READ_KEY is not set: the desktop check cannot read the NixOS configuration's flake.lock" >&2
            exit 1
          fi
          for name in KNOWN_HOSTS NIX_CONFIG_URL; do
            if [ -z "${!name:-}" ]; then
              echo "the repo variable ${name/KNOWN_HOSTS/FORGE_KNOWN_HOSTS} is not set" >&2
              exit 1
            fi
          done
          keys=$(mktemp -d -p /dev/shm iris-desktop.XXXXXX)
          (umask 077; printf '%s\n' "$READ_KEY" >"$keys/nix-config")
          printf '%s\n' "$KNOWN_HOSTS" >"$keys/known_hosts"
          ssh_options="-o IdentitiesOnly=yes -o IdentityAgent=none -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$keys/known_hosts"
          {
            echo "KEYS=$keys"
            echo "GIT_SSH_COMMAND=ssh -i $keys/nix-config $ssh_options"
          } >>"$GITHUB_ENV"

      - name: The configuration's nixpkgs on main
        env:
          NIX_CONFIG_URL: ${{ vars.NIX_CONFIG_URL }}
        run: |
          set -euo pipefail
          # Outside the workspace; only flake.lock is kept from the fetch.
          lock=$(mktemp -d)
          echo "LOCK=$lock" >>"$GITHUB_ENV"
          git -C "$lock" init -q
          git -C "$lock" fetch -q --depth 1 "$NIX_CONFIG_URL" main
          git -C "$lock" show FETCH_HEAD:flake.lock >"$lock/flake.lock"
          echo "nix-config: main at $(git -C "$lock" rev-parse FETCH_HEAD)"
          echo "nixpkgs: $(nix eval --raw -f desktop/nix/ci.nix --arg lock "$lock/flake.lock" nixpkgs)"

      - name: Build the package and run its tests
        run: |
          nix-build --no-out-link --cores 12 --max-jobs 2 desktop/nix/ci.nix -A package \
            --arg lock "$LOCK/flake.lock"

      - name: Remove the key
        if: always()
        run: |
          if [ -n "${KEYS-}" ]; then rm -rf "$KEYS"; fi
          if [ -n "${LOCK-}" ]; then rm -rf "$LOCK"; fi

  # The macOS desktop shell (desktop-macos/): its tests, then Iris.app, ad-hoc signed, zipped as an
  # artifact; nothing is published. It runs on the Mac behind `mouseion-macos`, on the host (no
  # Docker) as the runner's own user, with Xcode's Swift. SwiftPM's build stays warm in that user's
  # ~/.cache between runs. The app opens IRIS_DESKTOP_URL, the deployment's web app, so the artifact
  # is the app to install (desktop-macos/README.md); a train builds it too, as a check.
  macos:
    runs-on: mouseion-macos
    needs: [plan]
    if: needs.plan.outputs.macos == 'true'
    timeout-minutes: 60
    env:
      IRIS_URL: ${{ vars.IRIS_DESKTOP_URL }}
      # The Mac is a 24 GB laptop shared with long builds (a Chromium compile): keep SwiftPM to a
      # few compile jobs and the job at a low priority.
      SWIFT_JOBS: 4
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          set -euo pipefail
          if [ -z "$IRIS_URL" ]; then
            echo "the repo variable IRIS_DESKTOP_URL is not set: the app would not know which Iris to open" >&2
            exit 1
          fi
          sw_vers
          xcodebuild -version
          swift --version
          echo "BUILD_DIR=$HOME/.cache/build/iris/macos-ci" >> "$GITHUB_ENV"

      - name: Test the shell's core
        working-directory: desktop-macos
        run: nice -n 10 swift test --jobs "$SWIFT_JOBS" --scratch-path "$BUILD_DIR/test"

      - name: Build Iris.app
        env:
          IRIS_VERSION: 0.1.0
          IRIS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/iris-macos" nice -n 10 desktop-macos/build.sh
          app="$RUNNER_TEMP/iris-macos/Iris.app"
          /usr/libexec/PlistBuddy -c 'Print :IrisURL' -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleVersion' "$app/Contents/Info.plist"
          lipo -archs "$app/Contents/MacOS/Iris"
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Signature|CodeDirectory)'
          # ditto keeps the signature and the bundle's structure intact.
          ditto -c -k --keepParent "$app" "Iris-macos-0.1.0-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.zip"
          rm -rf "$RUNNER_TEMP/iris-macos"

      - uses: actions/upload-artifact@v3
        with:
          name: iris-macos
          path: Iris-macos-*.zip

  deploy:
    needs: [plan, bundle]
    # `plan` never says deploy for a train; said again here because this job changes what is live.
    if: needs.plan.outputs.deploy == 'true' && github.event_name != 'merge_group'
    runs-on: mouseion-deploy
    env:
      COMPOSE_FILE: ${{ vars.COMPOSE_FILE }}
      SERVICE: ${{ vars.DEPLOY_SERVICE }}
    steps:
      - name: The deployment's settings
        run: |
          set -euo pipefail
          for name in IMAGE COMPOSE_FILE SERVICE; do
            if [ -z "${!name:-}" ]; then
              echo "the repo variable ${name/SERVICE/DEPLOY_SERVICE} is not set" >&2
              exit 1
            fi
          done
          test -f "$COMPOSE_FILE" || { echo "the compose file (COMPOSE_FILE) is not on this runner" >&2; exit 1; }

      # For the compose-deploy action in .forgejo/actions, at this commit.
      - uses: actions/checkout@v4

      # Back up before editing. Only the newest 10 of this workflow's backups are kept.
      - name: Back up the compose file
        run: |
          set -euo pipefail
          cp -a "$COMPOSE_FILE" "$COMPOSE_FILE.bak.iris-web-$(date +%Y%m%d-%H%M%S)"
          ls -t "$COMPOSE_FILE".bak.iris-web-* | tail -n +11 | xargs -r rm --

      # Pin the service's image line, the one line that names IMAGE, to the new tag. The edit is
      # checked in a temp file and then written back into the same file rather than renamed over
      # it, in case anything bind-mounts this one file.
      - name: Pin the service to the new image
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA:0:7}"
          image_re="$(printf '%s' "$IMAGE" | sed -E 's/[][\\.*^$+?(){}|#]/\\&/g')"
          tmp="$(mktemp "$COMPOSE_FILE.deploy-web.XXXXXX")"
          trap 'rm -f "$tmp"' EXIT
          sed -E \
            -e "s#^([[:space:]]+image: )${image_re}:.*#\1$IMAGE:${sha}  \# pinned by mouseion/iris .forgejo/workflows/build.yml#" \
            "$COMPOSE_FILE" > "$tmp"
          test "$(grep -c "image: $IMAGE:${sha}  # pinned by" "$tmp")" = 1 \
            || { echo "expected exactly one $SERVICE image line to update; aborting before touching anything" >&2; exit 1; }
          docker compose -f "$tmp" --project-directory "$(dirname "$COMPOSE_FILE")" config -q
          cat "$tmp" > "$COMPOSE_FILE"

      # Each deploy pins a new :<sha>, so the replaced image is tagged with its old sha: same-repository removes it.
      - name: Pull and restart
        uses: ./.forgejo/actions/compose-deploy
        with:
          service: ${{ env.SERVICE }}
          compose-file: ${{ env.COMPOSE_FILE }}
          replaced-tags: same-repository

      # Success means the running container is on the new image and serves the header. Checked
      # by service name on the compose network: the public URL is not reachable from this runner.
      - name: Verify the running service
        run: |
          set -euo pipefail
          running="$(docker inspect "$SERVICE" --format '{{.Config.Image}}')"
          test "$running" = "$IMAGE:${GITHUB_SHA:0:7}" \
            || { echo "$SERVICE is running $running, not $IMAGE:${GITHUB_SHA:0:7}" >&2; exit 1; }
          for _ in $(seq 1 15); do
            if curl -sfI "http://$SERVICE/" | grep -qi 'content-security-policy:.*frame-ancestors'; then
              exit 0
            fi
            sleep 2
          done
          echo "$SERVICE does not serve the frame-ancestors header after the restart" >&2
          exit 1

  apk:
    needs: [plan, bundle]
    if: needs.plan.outputs.android == 'true'
    runs-on: mouseion-docker
    container:
      # Node 22, Android SDK 36, and JDK 21 beside the default 17, at /opt/java/jdk21.
      image: ${{ vars.ANDROID_BUILD_IMAGE }}
      volumes:
        - forge-gradle-cache:/gradle-cache
    defaults:
      run:
        shell: bash
    env:
      GRADLE_USER_HOME: /gradle-cache
      # @capacitor/android 8 requires source/target 21 (`invalid source release: 21` under 17).
      JAVA_HOME: /opt/java/jdk21
      VERSION_NAME: ${{ needs.plan.outputs.name }}
      VERSION_CODE: ${{ needs.plan.outputs.code }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v3
        with:
          name: android-inputs
          path: ./android-inputs

      # The synced mobile bundle and Capacitor's Android libraries, from `bundle`, unpacked over
      # the checkout. Its config.json must be the deployment's mobile config, as `bundle` wrote it.
      - name: Android inputs (into the Android project)
        env:
          CONFIG_MOBILE_JSON: ${{ vars.IRIS_CONFIG_MOBILE_JSON }}
        run: |
          set -euo pipefail
          tar -xzf android-inputs/android-inputs.tgz
          rm -r android-inputs
          [[ "$(< mobile/android/app/src/main/assets/public/config.json)" == "$(printf '%s' "$CONFIG_MOBILE_JSON")" ]] \
            || { echo "the bundle's config.json is not IRIS_CONFIG_MOBILE_JSON" >&2; exit 1; }
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > mobile/android/local.properties

      - name: Decode signing keystore
        if: needs.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          d="$(mktemp -d)"; chmod 700 "$d"
          printf '%s' "${{ secrets.HOUSE_MOUSEION_CHAT_KEYSTORE_BASE64 }}" | base64 -d > "$d/release.jks"
          chmod 600 "$d/release.jks"
          echo "MOUSEION_KEYSTORE_PATH=$d/release.jks" >> "$GITHUB_ENV"

      # A release APK is built whenever the Android project is, so breakage in the Gradle/Capacitor
      # wiring shows up early; it is only signed (and only R8-minified) when it will actually be
      # published. The unit tests (PushSummaryTest, PushHistoryTest) run first and gate the release.
      - name: Unit tests and release APK
        working-directory: mobile/android
        env:
          MOUSEION_KEYSTORE_PASSWORD: ${{ secrets.HOUSE_MOUSEION_CHAT_KEYSTORE_PASSWORD }}
          MOUSEION_KEY_ALIAS: ${{ secrets.HOUSE_MOUSEION_CHAT_KEY_ALIAS }}
          MOUSEION_KEY_PASSWORD: ${{ secrets.HOUSE_MOUSEION_CHAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :app:testReleaseUnitTest :app:assembleRelease \
            -PmouseionMinify="$PUBLISH" -PversionCode="$VERSION_CODE" -PmouseionVersionName="$VERSION_NAME"
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$apk" "../house.mouseion.iris-$VERSION_NAME.apk"
          if [[ "$PUBLISH" == "true" ]]; then
            APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
            "$APKSIGNER" verify --print-certs "../house.mouseion.iris-$VERSION_NAME.apk" | grep -E "certificate DN|SHA-256"
          fi

      - name: Remove keystore
        if: always() && needs.plan.outputs.publish == 'true'
        run: rm -rf "$(dirname "$MOUSEION_KEYSTORE_PATH")"

      # Best-effort only: nothing above depended on a git tag existing, and nothing below does
      # either (F-Droid publishing uses the computed name/code directly). This just leaves a
      # human-readable marker in the repo's history for a release that already happened. If the
      # checkout's token turns out not to have push access on this instance, this step fails
      # loudly in the log but never fails the run.
      - name: Tag this release in git (best-effort)
        if: needs.plan.outputs.publish == 'true' && github.event_name != 'merge_group'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "mouseion-ci"
          git config user.email "ci@mouseion.house"
          git tag -a "mobile-v$VERSION_NAME" -m "mobile-v$VERSION_NAME (auto-released by run $VERSION_CODE)"
          git push origin "mobile-v$VERSION_NAME"

      - name: Compress R8 mapping
        if: needs.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          gzip -c mobile/android/app/build/outputs/mapping/release/mapping.txt > "mobile/house.mouseion.iris-mapping-$VERSION_NAME.txt.gz"

      - uses: actions/upload-artifact@v3
        with:
          name: mouseion-apk
          path: mobile/house.mouseion.iris-${{ needs.plan.outputs.name }}.apk

      - uses: actions/upload-artifact@v3
        if: needs.plan.outputs.publish == 'true'
        with:
          name: mouseion-mapping
          path: mobile/house.mouseion.iris-mapping-${{ needs.plan.outputs.name }}.txt.gz

  publish-fdroid:
    needs: [plan, apk]
    # As for `deploy`: `plan` never says publish for a train.
    if: needs.plan.outputs.publish == 'true' && github.event_name != 'merge_group'
    runs-on: mouseion-deploy
    env:
      APPDATA: ${{ vars.FDROID_APPDATA }}
      FDROID_REPO: ${{ vars.FDROID_REPO }}
    steps:
      - name: The deployment's settings
        run: |
          set -euo pipefail
          for name in APPDATA FDROID_REPO; do
            if [ -z "${!name:-}" ]; then
              echo "the repo variable ${name/#APPDATA/FDROID_APPDATA} is not set" >&2
              exit 1
            fi
          done

      # For the fdroid-publish action in .forgejo/actions, at this commit. Before the download:
      # checkout empties a workspace that is not yet a repository.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v3
        with:
          name: mouseion-apk
          path: ./apk

      - name: Publish to F-Droid repo
        uses: ./.forgejo/actions/fdroid-publish
        with:
          apk: ./apk/house.mouseion.iris-${{ needs.plan.outputs.name }}.apk
          app-id: house.mouseion.iris
          base-name: ${{ env.FDROID_REPO }}
          appdata: ${{ env.APPDATA }}
          mark-current: 'true'
          version-code: ${{ needs.plan.outputs.code }}
          version-name: ${{ needs.plan.outputs.name }}
