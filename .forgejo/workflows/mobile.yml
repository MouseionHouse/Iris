# Mouseion Android app: build a signed release APK and publish it to the household F-Droid repo.
#
# - Any push touching mobile/ runs the unit tests and builds the APK (artifact only) so
#   breakage shows up early. Release builds are R8-minified; the R8 mapping is uploaded as an
#   artifact (and archived locally) so release crashes can be decoded.
# - A tag `mobile-vX.Y.Z` builds, signs and publishes X.Y.Z to fdroid.example.net and marks it
#   current. versionCode is the Forgejo run number, which only ever increases.
#
# Shape mirrors forge's android-release.yml: the build runs in the household android-build image
# (JDK 17 + SDK; platform 37 is installed at job start) on the `android` runner, and publishing runs
# as a separate host job (`homeserver`) where scripts/fdroid-publish.sh and docker are available.
# Signing material comes from repo secrets HOUSE_MOUSEION_CHAT_{KEYSTORE_BASE64,KEYSTORE_PASSWORD,
# KEY_ALIAS,KEY_PASSWORD}; the keystore is decoded into a private temp dir and removed afterwards.
name: mobile

on:
  push:
    branches: ['**']
    paths: ['mobile/**', '.forgejo/workflows/mobile.yml']
    tags: ['mobile-v*']

jobs:
  build:
    runs-on: android
    container:
      # Hardcoded: the DOMAIN/REGISTRY_USER Actions variables exist on the forge repo, not here.
      # The -bun tag is the one already present on the server docker host.
      image: forgejo.example.net/household/android-build:jdk17-sdk36-bun
      volumes:
        - mouseion-gradle-cache:/gradle-cache
    defaults:
      run:
        shell: bash
    env:
      GRADLE_USER_HOME: /gradle-cache
    outputs:
      publish: ${{ steps.ver.outputs.publish }}
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/mobile-v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Android SDK platform 37
        run: |
          set -euo pipefail
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > mobile/local.properties

      - name: Unit tests
        working-directory: mobile
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :shared:jvmTest

      - name: Decode signing keystore
        run: |
          set -euo pipefail
          d="$(mktemp -d)"; chmod 700 "$d"
          printf '%s' "${{ secrets.HOUSE_MOUSEION_CHAT_KEYSTORE_BASE64 }}" | base64 -d > "$d/release.jks"
          chmod 600 "$d/release.jks"
          echo "MOUSEION_KEYSTORE_PATH=$d/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK (R8-minified)
        working-directory: mobile
        env:
          MOUSEION_KEYSTORE_PASSWORD: ${{ secrets.HOUSE_MOUSEION_CHAT_KEYSTORE_PASSWORD }}
          MOUSEION_KEY_ALIAS: ${{ secrets.HOUSE_MOUSEION_CHAT_KEY_ALIAS }}
          MOUSEION_KEY_PASSWORD: ${{ secrets.HOUSE_MOUSEION_CHAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :androidApp:assembleRelease \
            -PmouseionMinify=true \
            -PversionCode=${{ steps.ver.outputs.code }} -PmouseionVersionName=${{ steps.ver.outputs.name }}
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "house.mouseion.chat-${{ steps.ver.outputs.name }}.apk"
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "house.mouseion.chat-${{ steps.ver.outputs.name }}.apk" | grep -E "certificate DN|SHA-256"

      - name: Remove keystore
        if: always()
        run: rm -rf "$(dirname "$MOUSEION_KEYSTORE_PATH")"

      - name: Compress R8 mapping
        working-directory: mobile
        run: |
          set -euo pipefail
          gzip -c androidApp/build/outputs/mapping/release/mapping.txt > "house.mouseion.chat-mapping-${{ steps.ver.outputs.name }}.txt.gz"

      - uses: actions/upload-artifact@v3
        with:
          name: mouseion-apk
          path: mobile/house.mouseion.chat-${{ steps.ver.outputs.name }}.apk

      - uses: actions/upload-artifact@v3
        with:
          name: mouseion-mapping
          path: mobile/house.mouseion.chat-mapping-${{ steps.ver.outputs.name }}.txt.gz

  publish-fdroid:
    needs: [build]
    if: needs.build.outputs.publish == 'true'
    runs-on: homeserver
    env:
      APPDATA: /srv/data/appdata
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: mouseion-apk
          path: ./apk

      - name: Publish to F-Droid repo
        run: |
          set -euo pipefail
          /home/user/homeserver/scripts/fdroid-publish.sh \
            --apk "./apk/house.mouseion.chat-${{ needs.build.outputs.name }}.apk" \
            --app-id house.mouseion.chat \
            --mark-current --version-code "${{ needs.build.outputs.code }}" --version-name "${{ needs.build.outputs.name }}"
