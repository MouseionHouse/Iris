# Mouseion Android app: build a signed release APK and publish it to the household F-Droid repo.
#
# This is a Capacitor wrapper around the mobile build of this fork's own web UI (see
# mobile/WRAPPER-PLAN.md) — not a separate native app. "Build" here means: build the web bundle
# for mobile (npm run build:mobile), let Capacitor copy it into the Android project (cap sync),
# then build the APK with Gradle as any Android app would.
#
# Versioning is automatic, not manual tags: every push to RELEASE_BRANCH (the "Version" step,
# below) that touches a tracked path computes the next semantic version from the latest
# `mobile-vX.Y.Z` tag and the commit messages since it — a `feat:` commit bumps minor, a
# `BREAKING CHANGE:` footer or a `!` after the type (`feat!:`, `fix!:`) bumps major, anything else
# (including this project's own informal `mobile: ...`/`web: ...` commits) bumps patch — then
# builds, signs and publishes that version to fdroid.example.net and marks it current. A push
# to any other branch is a check only: the mobile web bundle always, and the Android project
# (unit tests and an unsigned, unminified APK) only when the branch changes something native
# (the "Native changes" step). A web-only branch used to spend four minutes on an APK nobody
# installed, and the merge then built the same tree again for the release.
# The git tag itself is best-effort (see "tag this release" below): it is never what triggers a
# release, only a record of one after the fact.
#
# Release builds are R8-minified once verified stable (mouseionMinify below); the R8 mapping is
# uploaded as an artifact so release crashes can be decoded. versionCode is the Forgejo run
# number, which only ever increases — required for F-Droid to offer the update.
#
# Runs in the household android-build image on the `android` runner; publishing runs as a
# separate host job (`homeserver`) where scripts/fdroid-publish.sh and docker are available.
# Signing material comes from repo secrets HOUSE_MOUSEION_CHAT_{KEYSTORE_BASE64,KEYSTORE_PASSWORD,
# KEY_ALIAS,KEY_PASSWORD}; the keystore is decoded into a private temp dir and removed afterwards.
name: mobile

on:
  push:
    branches: ['**']
    paths:
      [
        'src/**',
        'public/**',
        'config.json',
        'config.mobile.json',
        'vite.config.js',
        'build.config.ts',
        'capacitor.config.ts',
        'package.json',
        'package-lock.json',
        'mobile/**',
        '.forgejo/workflows/mobile.yml',
      ]

jobs:
  build:
    runs-on: android
    container:
      # Hardcoded: the DOMAIN/REGISTRY_USER Actions variables exist on the forge repo, not here.
      # The -bun tag (Node 22 + JDK 17 + Android SDK 36 baked in) is the one already on server.
      image: forgejo.example.net/household/android-build:jdk17-sdk36-bun
      volumes:
        - mouseion-gradle-cache:/gradle-cache
    defaults:
      run:
        shell: bash
    env:
      GRADLE_USER_HOME: /gradle-cache
      # The branch that gets an automatic release on every push. `dev` is the fork's one trunk
      # (owner decision, 2026-09-23): mobile/phase-2 merged into it, and upstream Cinny merges land
      # there too — so an upstream merge that touches a tracked path releases an APK like any
      # other push.
      RELEASE_BRANCH: dev
    outputs:
      publish: ${{ steps.ver.outputs.publish }}
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the version step needs every `mobile-v*` tag and the commits
          # since the latest one, which a shallow clone would not have.
          fetch-depth: 0

      - name: Version — the next semantic release, or a build-only marker
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force > /dev/null 2>&1 || true

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/$RELEASE_BRANCH" ]]; then
            latest="$(git tag -l 'mobile-v*' | grep -E '^mobile-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
            lmajor=0; lminor=0
            if [[ -n "$latest" ]]; then
              IFS=. read -r lmajor lminor _ <<< "${latest#mobile-v}"
            fi
            if [[ -z "$latest" ]] || (( lmajor == 0 && lminor < 4 )); then
              # First release of the Capacitor wrapper (mobile/WRAPPER-PLAN.md). There is an old
              # clean mobile-v0.1.1 tag from the very first Compose bring-up (everything since used
              # -rcN suffixes, so this loop never saw them as "latest") — the Compose app's last
              # version was 0.3.0, so the wrapper starts fresh at 0.4.0 rather than bumping 0.1.1.
              next="0.4.0"
            else
              msgs="$(git log --format=%B "$latest..HEAD")"
              bump=patch
              if echo "$msgs" | grep -qiE '^BREAKING CHANGE:'; then
                bump=major
              elif echo "$msgs" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then
                bump=major
              elif echo "$msgs" | grep -qE '^feat(\([^)]*\))?:'; then
                bump=minor
              fi
              IFS=. read -r major minor patch <<< "${latest#mobile-v}"
              case "$bump" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
              esac
              next="$major.$minor.$patch"
            fi
            echo "name=$next" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # The Android project is built for every release, and on other branches only when they
      # differ from the release branch in what Gradle compiles or packages besides the web bundle.
      - name: Native changes — does this run need the Android build?
        id: native
        run: |
          set -euo pipefail
          if [[ "${{ steps.ver.outputs.publish }}" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin "$RELEASE_BRANCH"
          changed="$(git diff --name-only "origin/$RELEASE_BRANCH...HEAD" -- \
            mobile/android capacitor.config.ts package.json package-lock.json .forgejo/workflows/mobile.yml)"
          if [[ -n "$changed" ]]; then
            echo "$changed"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "no native change against $RELEASE_BRANCH: web bundle check only"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      # @capacitor/android 8 requires source/target 21 (`invalid source release: 21` under the
      # image's baked-in JDK 17); the image only ships 17, so install 21 alongside it and point
      # Gradle at it for every later step. Verified on Ubuntu 22.04 (this image's base): the
      # universe repo carries openjdk-21-jdk-headless without extra repos.
      - name: JDK 21 (for @capacitor/android; keep JDK 17 as the default `java`)
        if: steps.native.outputs.build == 'true'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends openjdk-21-jdk-headless > /dev/null
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Android SDK platform 36
        if: steps.native.outputs.build == 'true'
        run: |
          set -euo pipefail
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > mobile/android/local.properties

      # The download cache lives on the volume that already holds Gradle's, so a run fetches
      # only the packages that changed.
      - name: npm ci
        run: npm ci --cache /gradle-cache/npm --prefer-offline

      - name: Build the mobile web bundle
        run: npm run build:mobile

      - name: Capacitor sync (copy the web bundle into the Android project)
        if: steps.native.outputs.build == 'true'
        run: npx cap sync android

      - name: Decode signing keystore
        if: steps.ver.outputs.publish == 'true'
        run: |
          set -euo pipefail
          d="$(mktemp -d)"; chmod 700 "$d"
          printf '%s' "${{ secrets.HOUSE_MOUSEION_CHAT_KEYSTORE_BASE64 }}" | base64 -d > "$d/release.jks"
          chmod 600 "$d/release.jks"
          echo "MOUSEION_KEYSTORE_PATH=$d/release.jks" >> "$GITHUB_ENV"

      # A release APK is built whenever the Android project is, so breakage in the Gradle/Capacitor
      # wiring shows up early; it is only signed (and only R8-minified) when it will actually be
      # published, mirroring the old workflow's "opt-in minify until verified on a device" caution.
      # The unit tests (PushSummaryTest, PushHistoryTest) run first and gate the release.
      - name: Unit tests and release APK
        if: steps.native.outputs.build == 'true'
        working-directory: mobile/android
        env:
          MOUSEION_KEYSTORE_PASSWORD: ${{ secrets.HOUSE_MOUSEION_CHAT_KEYSTORE_PASSWORD }}
          MOUSEION_KEY_ALIAS: ${{ secrets.HOUSE_MOUSEION_CHAT_KEY_ALIAS }}
          MOUSEION_KEY_PASSWORD: ${{ secrets.HOUSE_MOUSEION_CHAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :app:testReleaseUnitTest :app:assembleRelease \
            -PmouseionMinify=${{ steps.ver.outputs.publish }} \
            -PversionCode=${{ steps.ver.outputs.code }} -PmouseionVersionName=${{ steps.ver.outputs.name }}
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$apk" "../house.mouseion.chat-${{ steps.ver.outputs.name }}.apk"
          if [[ "${{ steps.ver.outputs.publish }}" == "true" ]]; then
            APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
            "$APKSIGNER" verify --print-certs "../house.mouseion.chat-${{ steps.ver.outputs.name }}.apk" | grep -E "certificate DN|SHA-256"
          fi

      - name: Remove keystore
        if: always() && steps.ver.outputs.publish == 'true'
        run: rm -rf "$(dirname "$MOUSEION_KEYSTORE_PATH")"

      # Best-effort only: nothing above depended on a git tag existing, and nothing below does
      # either (F-Droid publishing uses the computed name/code directly). This just leaves a
      # human-readable marker in the repo's history for a release that already happened. If the
      # checkout's token turns out not to have push access on this instance, this step fails
      # loudly in the log but never fails the run.
      - name: Tag this release in git (best-effort)
        if: steps.ver.outputs.publish == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "mouseion-ci"
          git config user.email "ci@mouseion.house"
          git tag -a "mobile-v${{ steps.ver.outputs.name }}" \
            -m "mobile-v${{ steps.ver.outputs.name }} (auto-released by run ${{ steps.ver.outputs.code }})"
          git push origin "mobile-v${{ steps.ver.outputs.name }}"

      - name: Compress R8 mapping
        if: steps.ver.outputs.publish == 'true'
        run: |
          set -euo pipefail
          gzip -c mobile/android/app/build/outputs/mapping/release/mapping.txt > "mobile/house.mouseion.chat-mapping-${{ steps.ver.outputs.name }}.txt.gz"

      - uses: actions/upload-artifact@v3
        if: steps.native.outputs.build == 'true'
        with:
          name: mouseion-apk
          path: mobile/house.mouseion.chat-${{ steps.ver.outputs.name }}.apk

      - uses: actions/upload-artifact@v3
        if: steps.ver.outputs.publish == 'true'
        with:
          name: mouseion-mapping
          path: mobile/house.mouseion.chat-mapping-${{ steps.ver.outputs.name }}.txt.gz

  publish-fdroid:
    needs: [build]
    if: needs.build.outputs.publish == 'true'
    runs-on: homeserver
    env:
      APPDATA: /srv/data/appdata
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: mouseion-apk
          path: ./apk

      - name: Publish to F-Droid repo
        run: |
          set -euo pipefail
          /home/user/homeserver/scripts/fdroid-publish.sh \
            --apk "./apk/house.mouseion.chat-${{ needs.build.outputs.name }}.apk" \
            --app-id house.mouseion.chat \
            --mark-current --version-code "${{ needs.build.outputs.code }}" --version-name "${{ needs.build.outputs.name }}"
