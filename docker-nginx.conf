# A template, rendered when the image is built (scripts/nginx-conf.js, from the Dockerfile's
# HUB_ORIGINS and HUB_PREVIEW_PATTERN build args, the same two the hub bridge in
# src/app/hub/hubBridge.ts is built with). The frame-ancestors placeholder becomes the listed
# origins, plus $hub_preview_origin when there is a preview pattern, and the map's placeholder
# becomes the pattern's entry. With neither, only the client itself may frame it.
#
# A hub pull-request preview may frame the client too, so a change to the chat spoke can be tried
# before it merges. CSP cannot wildcard part of a label, and a wildcard on the hub's domain would
# admit every host under it, so the one preview named by the Referer is added and no other. The
# browser still checks the real ancestor: a forged Referer only loosens the header for a request no
# browser frame made.
map $http_referer $hub_preview_origin {
  default "";
  @HUB_PREVIEW_MAP@
}

server {
  listen 80;
  listen [::]:80;

  # Only allow the client to be framed by itself or the hub.
  # Prevents clickjacking of a signed-in session by arbitrary sites.
  add_header Content-Security-Policy "frame-ancestors 'self'@HUB_FRAME_ANCESTORS@" always;
  # The header depends on the Referer, so a cached copy must too.
  add_header Vary Referer always;

  location / {
    root /usr/share/nginx/html;

    rewrite ^/config.json$ /config.json break;
    rewrite ^/manifest.json$ /manifest.json break;

    rewrite ^/sw.js$ /sw.js break;
    rewrite ^/pdf.worker.min.js$ /pdf.worker.min.js break;

    rewrite ^/public/(.*)$ /public/$1 break;
    rewrite ^/assets/(.*)$ /assets/$1 break;

    rewrite ^(.+)$ /index.html break;
  }
}
