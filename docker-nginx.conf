# A hub pull-request preview (hub-pr-<n>.example.org) may frame the client
# too, so a change to the chat spoke can be tried before it merges. CSP cannot
# wildcard part of a label, and *.example.org would admit every household
# host, so the one preview named by the Referer is added and no other. The
# browser still checks the real ancestor: a forged Referer only loosens the
# header for a request no browser frame made. Keep in step with
# HUB_ORIGIN_PATTERN in src/app/hub/hubBridge.ts.
map $http_referer $hub_preview_origin {
  default "";
  "~^(?<origin>https://hub-pr-[0-9]+\.example\.org)(/|$)" $origin;
}

server {
  listen 80;
  listen [::]:80;

  # Only allow the client to be framed by itself or the household hub.
  # Prevents clickjacking of a signed-in session by arbitrary sites.
  add_header Content-Security-Policy "frame-ancestors 'self' https://hub.example.org $hub_preview_origin" always;
  # The header depends on the Referer, so a cached copy must too.
  add_header Vary Referer always;

  location / {
    root /usr/share/nginx/html;

    rewrite ^/config.json$ /config.json break;
    rewrite ^/manifest.json$ /manifest.json break;

    rewrite ^/sw.js$ /sw.js break;
    rewrite ^/pdf.worker.min.js$ /pdf.worker.min.js break;

    rewrite ^/public/(.*)$ /public/$1 break;
    rewrite ^/assets/(.*)$ /assets/$1 break;

    rewrite ^(.+)$ /index.html break;
  }
}
