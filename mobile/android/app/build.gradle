apply plugin: 'com.android.application'

// Release signing comes from the environment (CI secrets or a local shell); nothing is stored in
// the repo. MOUSEION_KEYSTORE_PATH, MOUSEION_KEYSTORE_PASSWORD, MOUSEION_KEY_ALIAS,
// MOUSEION_KEY_PASSWORD (same names the retired Compose app used).
def releaseKeystore = System.getenv("MOUSEION_KEYSTORE_PATH")
def hasReleaseKeystore = releaseKeystore != null && !releaseKeystore.isEmpty()

// Version: name from -PmouseionVersionName (CI passes the tag's X.Y.Z), code from -PversionCode
// (CI passes the Forgejo run number, which only ever increases — required for F-Droid updates).
def mouseionVersionName = project.hasProperty('mouseionVersionName') ? project.mouseionVersionName : "0.1.0"
def mouseionVersionCode = project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1

// Minification is opt-in (-PmouseionMinify=true) until the R8 build is verified on a device —
// same caution the Compose app used, now for Capacitor's plugin reflection instead of Compose's.
def mouseionMinify = project.hasProperty('mouseionMinify') && project.mouseionMinify == "true"

android {
    namespace = "house.mouseion.chat"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "house.mouseion.chat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode mouseionVersionCode
        versionName mouseionVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("MOUSEION_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MOUSEION_KEY_ALIAS")
                keyPassword System.getenv("MOUSEION_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled mouseionMinify
            shrinkResources mouseionMinify
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // UnifiedPush (ntfy) receiver: MouseionPushService / MouseionPushPlugin. Same version the
    // Compose app shipped, so its stored registration carries over on upgrade.
    implementation "org.unifiedpush.android:connector:$unifiedPushConnectorVersion"
    // org.json is an Android stub on the plain JVM; the unit tests need the real one.
    testImplementation "org.json:json:$orgJsonVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
